<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">
  <title>Diagrama de Clases – ISMP 3D Anatomy</title>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
    <marker id="ret" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#111" rx="12"/>
  <text x="450" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#eee">Diagrama de Clases — ISMP 3D Anatomy</text>

  <!-- User -->
  <rect x="20" y="45" width="185" height="185" rx="5" fill="#1a2640" stroke="#4a6fa5" stroke-width="1.5"/>
  <rect x="20" y="45" width="185" height="22" rx="5" fill="#2a3f6a"/>
  <rect x="20" y="56" width="185" height="11" fill="#2a3f6a"/>
  <text x="112" y="61" text-anchor="middle" font-size="11" font-weight="700" fill="#7fa8d8">User</text>
  <line x1="20" y1="67" x2="205" y2="67" stroke="#4a6fa5" stroke-width="1"/>
  <text x="30" y="82" font-size="9" fill="#aac4e8">id: String (cuid)</text>
  <text x="30" y="96" font-size="9" fill="#aac4e8">name: String</text>
  <text x="30" y="110" font-size="9" fill="#aac4e8">email: String</text>
  <text x="30" y="124" font-size="9" fill="#aac4e8">passwordHash: String</text>
  <text x="30" y="138" font-size="9" fill="#aac4e8">dni: String?</text>
  <text x="30" y="152" font-size="9" fill="#aac4e8">role: Role {ADMIN,DOCENTE,ESTUDIANTE}</text>
  <text x="30" y="166" font-size="9" fill="#aac4e8">estado: EstadoUsuario</text>
  <text x="30" y="180" font-size="9" fill="#aac4e8">activationCode: String?</text>
  <line x1="20" y1="188" x2="205" y2="188" stroke="#4a6fa5" stroke-width="1"/>
  <text x="30" y="202" font-size="9" fill="#7fa8d8">login()</text>
  <text x="30" y="216" font-size="9" fill="#7fa8d8">activate(code)</text>

  <!-- UserCarrera -->
  <rect x="230" y="45" width="140" height="90" rx="5" fill="#1a2b20" stroke="#5a8f5a" stroke-width="1.5"/>
  <rect x="230" y="45" width="140" height="22" rx="5" fill="#2a4a2a"/>
  <rect x="230" y="56" width="140" height="11" fill="#2a4a2a"/>
  <text x="300" y="61" text-anchor="middle" font-size="10" font-weight="700" fill="#8fbf8f">UserCarrera</text>
  <line x1="230" y1="67" x2="370" y2="67" stroke="#5a8f5a" stroke-width="1"/>
  <text x="240" y="82" font-size="9" fill="#aad4aa">userId: String</text>
  <text x="240" y="96" font-size="9" fill="#aad4aa">carreraId: String</text>
  <text x="240" y="118" font-size="9" fill="#8fbf8f">«pivot»</text>

  <!-- Carrera -->
  <rect x="390" y="45" width="155" height="105" rx="5" fill="#2a1a2a" stroke="#8f5a8f" stroke-width="1.5"/>
  <rect x="390" y="45" width="155" height="22" rx="5" fill="#4a2a4a"/>
  <rect x="390" y="56" width="155" height="11" fill="#4a2a4a"/>
  <text x="467" y="61" text-anchor="middle" font-size="11" font-weight="700" fill="#bf8fbf">Carrera</text>
  <line x1="390" y1="67" x2="545" y2="67" stroke="#8f5a8f" stroke-width="1"/>
  <text x="400" y="82" font-size="9" fill="#d4aad4">id: String (cuid)</text>
  <text x="400" y="96" font-size="9" fill="#d4aad4">name: String</text>
  <text x="400" y="110" font-size="9" fill="#d4aad4">slug: String</text>
  <line x1="390" y1="120" x2="545" y2="120" stroke="#8f5a8f" stroke-width="1"/>
  <text x="400" y="135" font-size="9" fill="#bf8fbf">getMaterias()</text>

  <!-- Materia -->
  <rect x="390" y="170" width="155" height="105" rx="5" fill="#2a1a2a" stroke="#8f5a8f" stroke-width="1.5"/>
  <rect x="390" y="170" width="155" height="22" rx="5" fill="#4a2a4a"/>
  <rect x="390" y="181" width="155" height="11" fill="#4a2a4a"/>
  <text x="467" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#bf8fbf">Materia</text>
  <line x1="390" y1="192" x2="545" y2="192" stroke="#8f5a8f" stroke-width="1"/>
  <text x="400" y="207" font-size="9" fill="#d4aad4">id: String (cuid)</text>
  <text x="400" y="221" font-size="9" fill="#d4aad4">name: String</text>
  <text x="400" y="235" font-size="9" fill="#d4aad4">carreraId: String</text>
  <line x1="390" y1="245" x2="545" y2="245" stroke="#8f5a8f" stroke-width="1"/>
  <text x="400" y="260" font-size="9" fill="#bf8fbf">getPreguntas()</text>

  <!-- Question -->
  <rect x="20" y="260" width="185" height="155" rx="5" fill="#2a2a1a" stroke="#8f8f5a" stroke-width="1.5"/>
  <rect x="20" y="260" width="185" height="22" rx="5" fill="#4a4a2a"/>
  <rect x="20" y="271" width="185" height="11" fill="#4a4a2a"/>
  <text x="112" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#d4d48f">Question</text>
  <line x1="20" y1="282" x2="205" y2="282" stroke="#8f8f5a" stroke-width="1"/>
  <text x="30" y="297" font-size="9" fill="#d4d4aa">id: String (cuid)</text>
  <text x="30" y="311" font-size="9" fill="#d4d4aa">enunciado: String</text>
  <text x="30" y="325" font-size="9" fill="#d4d4aa">tipo: TipoPregunta</text>
  <text x="30" y="339" font-size="9" fill="#d4d4aa">  {OPCION_MULTIPLE,V_F,ID}</text>
  <text x="30" y="353" font-size="9" fill="#d4d4aa">opciones: String[]</text>
  <text x="30" y="367" font-size="9" fill="#d4d4aa">respuestaCorrecta: String</text>
  <text x="30" y="381" font-size="9" fill="#d4d4aa">peso: Int</text>
  <text x="30" y="395" font-size="9" fill="#d4d4aa">materiaId: String</text>

  <!-- Attempt -->
  <rect x="560" y="45" width="175" height="165" rx="5" fill="#2a1a1a" stroke="#8f5a5a" stroke-width="1.5"/>
  <rect x="560" y="45" width="175" height="22" rx="5" fill="#4a2a2a"/>
  <rect x="560" y="56" width="175" height="11" fill="#4a2a2a"/>
  <text x="647" y="61" text-anchor="middle" font-size="11" font-weight="700" fill="#d48f8f">Attempt</text>
  <line x1="560" y1="67" x2="735" y2="67" stroke="#8f5a5a" stroke-width="1"/>
  <text x="570" y="82" font-size="9" fill="#d4aaaa">id: String (cuid)</text>
  <text x="570" y="96" font-size="9" fill="#d4aaaa">userId: String</text>
  <text x="570" y="110" font-size="9" fill="#d4aaaa">materiaId: String</text>
  <text x="570" y="124" font-size="9" fill="#d4aaaa">cantidad: Int</text>
  <text x="570" y="138" font-size="9" fill="#d4aaaa">score: Int</text>
  <text x="570" y="152" font-size="9" fill="#d4aaaa">startedAt: DateTime</text>
  <text x="570" y="166" font-size="9" fill="#d4aaaa">finishedAt: DateTime?</text>
  <line x1="560" y1="175" x2="735" y2="175" stroke="#8f5a5a" stroke-width="1"/>
  <text x="570" y="190" font-size="9" fill="#d48f8f">start()</text>
  <text x="570" y="204" font-size="9" fill="#d48f8f">finish()</text>

  <!-- AttemptQuestion -->
  <rect x="560" y="240" width="175" height="110" rx="5" fill="#2a1a1a" stroke="#8f5a5a" stroke-width="1.5"/>
  <rect x="560" y="240" width="175" height="22" rx="5" fill="#4a2a2a"/>
  <rect x="560" y="251" width="175" height="11" fill="#4a2a2a"/>
  <text x="647" y="257" text-anchor="middle" font-size="10" font-weight="700" fill="#d48f8f">AttemptQuestion</text>
  <line x1="560" y1="262" x2="735" y2="262" stroke="#8f5a5a" stroke-width="1"/>
  <text x="570" y="277" font-size="9" fill="#d4aaaa">id: String (cuid)</text>
  <text x="570" y="291" font-size="9" fill="#d4aaaa">attemptId: String</text>
  <text x="570" y="305" font-size="9" fill="#d4aaaa">questionId: String</text>
  <text x="570" y="319" font-size="9" fill="#d4aaaa">snapshot: Json</text>
  <text x="570" y="333" font-size="9" fill="#d4aaaa">orden: Int</text>

  <!-- AnswerLog -->
  <rect x="560" y="375" width="175" height="120" rx="5" fill="#2a1a1a" stroke="#8f5a5a" stroke-width="1.5"/>
  <rect x="560" y="375" width="175" height="22" rx="5" fill="#4a2a2a"/>
  <rect x="560" y="386" width="175" height="11" fill="#4a2a2a"/>
  <text x="647" y="392" text-anchor="middle" font-size="11" font-weight="700" fill="#d48f8f">AnswerLog</text>
  <line x1="560" y1="397" x2="735" y2="397" stroke="#8f5a5a" stroke-width="1"/>
  <text x="570" y="412" font-size="9" fill="#d4aaaa">id: String (cuid)</text>
  <text x="570" y="426" font-size="9" fill="#d4aaaa">attemptQuestionId: String</text>
  <text x="570" y="440" font-size="9" fill="#d4aaaa">respuesta: String</text>
  <text x="570" y="454" font-size="9" fill="#d4aaaa">esCorrecta: Boolean</text>
  <text x="570" y="468" font-size="9" fill="#d4aaaa">answeredAt: DateTime</text>
  <text x="570" y="482" font-size="9" fill="#d4aaaa">snapshotRespuesta: String</text>

  <!-- Relations -->
  <line x1="205" y1="120" x2="230" y2="90" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="215" y="105" font-size="8" fill="#666">1</text>
  <text x="225" y="80" font-size="8" fill="#666">*</text>
  <line x1="370" y1="90" x2="390" y2="90" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="372" y="85" font-size="8" fill="#666">*</text>
  <text x="383" y="85" font-size="8" fill="#666">1</text>
  <line x1="467" y1="150" x2="467" y2="170" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="473" y="163" font-size="8" fill="#666">1..*</text>
  <line x1="390" y1="230" x2="205" y2="310" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="320" y="285" font-size="8" fill="#666">1..*</text>
  <line x1="205" y1="90" x2="560" y2="90" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" stroke-dasharray="4,2"/>
  <text x="380" y="84" font-size="8" fill="#666">1  realiza  *</text>
  <line x1="647" y1="210" x2="647" y2="240" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="653" y="230" font-size="8" fill="#666">1..*</text>
  <line x1="647" y1="350" x2="647" y2="375" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="653" y="367" font-size="8" fill="#666">0..1</text>
  <line x1="205" y1="340" x2="560" y2="290" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" stroke-dasharray="4,2"/>
  <text x="370" y="310" font-size="8" fill="#666">snapshot</text>

  <!-- Leyenda -->
  <rect x="20" y="450" width="340" height="55" rx="5" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="190" y="467" text-anchor="middle" font-size="10" font-weight="600" fill="#888">Leyenda</text>
  <line x1="35" y1="482" x2="75" y2="482" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="85" y="486" font-size="9" fill="#888">asociación</text>
  <line x1="35" y1="497" x2="75" y2="497" stroke="#666" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <text x="85" y="501" font-size="9" fill="#888">dependencia / FK lógica</text>
  <text x="200" y="486" font-size="9" fill="#888">1 / * / 1..* → multiplicidad</text>
  <text x="200" y="501" font-size="9" fill="#888">snapshot → copia en JSON al crear</text>
</svg>
