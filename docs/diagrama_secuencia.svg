<svg viewBox="0 0 860 580" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">
  <title>Diagrama de Secuencia – Inicio de Cuestionario</title>

  <defs>
    <marker id="a1" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#7fa8d8"/>
    </marker>
    <marker id="a2" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#8fbf8f"/>
    </marker>
    <marker id="a3" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#d4d48f"/>
    </marker>
    <marker id="a4" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#bf8fbf"/>
    </marker>
    <marker id="ret" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#666"/>
    </marker>
  </defs>

  <rect width="860" height="580" fill="#111" rx="12"/>
  <text x="430" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#eee">Diagrama de Secuencia — Iniciar Cuestionario (POST /attempts/start)</text>

  <!-- Lifelines -->
  <rect x="30" y="42" width="110" height="30" rx="4" fill="#1a2640" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="85" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#7fa8d8">:Estudiante</text>
  <line x1="85" y1="72" x2="85" y2="555" stroke="#4a6fa5" stroke-width="1" stroke-dasharray="5,4"/>

  <rect x="195" y="42" width="135" height="30" rx="4" fill="#1a2b1a" stroke="#5a8f5a" stroke-width="1.5"/>
  <text x="262" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#8fbf8f">:AttemptsController</text>
  <line x1="262" y1="72" x2="262" y2="555" stroke="#5a8f5a" stroke-width="1" stroke-dasharray="5,4"/>

  <rect x="360" y="42" width="110" height="30" rx="4" fill="#2a2a1a" stroke="#8f8f5a" stroke-width="1.5"/>
  <text x="415" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#d4d48f">:JwtAuthGuard</text>
  <line x1="415" y1="72" x2="415" y2="555" stroke="#8f8f5a" stroke-width="1" stroke-dasharray="5,4"/>

  <rect x="505" y="42" width="120" height="30" rx="4" fill="#1a2b1a" stroke="#5a8f5a" stroke-width="1.5"/>
  <text x="565" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#8fbf8f">:AttemptsService</text>
  <line x1="565" y1="72" x2="565" y2="555" stroke="#5a8f5a" stroke-width="1" stroke-dasharray="5,4"/>

  <rect x="660" y="42" width="120" height="30" rx="4" fill="#2a1a2a" stroke="#8f5a8f" stroke-width="1.5"/>
  <text x="720" y="62" text-anchor="middle" font-size="10" font-weight="600" fill="#bf8fbf">:PrismaService</text>
  <line x1="720" y1="72" x2="720" y2="555" stroke="#8f5a8f" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Messages -->
  <line x1="85" y1="105" x2="257" y2="105" stroke="#7fa8d8" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="168" y="100" text-anchor="middle" font-size="9" fill="#7fa8d8">POST /attempts/start</text>
  <text x="168" y="113" text-anchor="middle" font-size="8" fill="#555">{ materiaId, cantidad }</text>

  <line x1="262" y1="130" x2="410" y2="130" stroke="#d4d48f" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="336" y="126" text-anchor="middle" font-size="9" fill="#d4d48f">validateToken(Bearer JWT)</text>

  <line x1="410" y1="152" x2="267" y2="152" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="338" y="148" text-anchor="middle" font-size="8" fill="#666">{ sub, role, carreraIds[] }</text>

  <rect x="190" y="157" width="280" height="25" rx="3" fill="#2a1a1a" stroke="#8f5a5a" stroke-width="1"/>
  <text x="205" y="173" font-size="8" fill="#d48f8f">alt [token inválido]  → 401 Unauthorized</text>

  <line x1="262" y1="200" x2="560" y2="200" stroke="#8fbf8f" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="411" y="195" text-anchor="middle" font-size="9" fill="#8fbf8f">start(dto, userId, role, carreraIds)</text>

  <line x1="565" y1="225" x2="715" y2="225" stroke="#bf8fbf" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="640" y="220" text-anchor="middle" font-size="9" fill="#bf8fbf">materia.findFirst({ id, carreras })</text>

  <line x1="715" y1="245" x2="570" y2="245" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="642" y="241" text-anchor="middle" font-size="8" fill="#666">materia | null</text>

  <rect x="350" y="250" width="385" height="25" rx="3" fill="#2a1a1a" stroke="#8f5a5a" stroke-width="1"/>
  <text x="365" y="267" font-size="8" fill="#d48f8f">alt [materia no encontrada]  → 404 Not Found</text>

  <rect x="505" y="280" width="220" height="25" rx="3" fill="#1a2b1a" stroke="#5a8f5a" stroke-width="1"/>
  <text x="615" y="296" text-anchor="middle" font-size="8" fill="#8fbf8f">«validate» carreraId ∈ carreraIds?</text>

  <rect x="350" y="310" width="385" height="25" rx="3" fill="#2a1a1a" stroke="#8f5a5a" stroke-width="1"/>
  <text x="365" y="326" font-size="8" fill="#d48f8f">alt [carrera no coincide]  → 403 Forbidden "Sin acceso a esta materia"</text>

  <line x1="565" y1="355" x2="715" y2="355" stroke="#bf8fbf" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="640" y="350" text-anchor="middle" font-size="9" fill="#bf8fbf">question.findMany({ materiaId })</text>

  <line x1="715" y1="375" x2="570" y2="375" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="642" y="371" text-anchor="middle" font-size="8" fill="#666">Question[]</text>

  <rect x="505" y="382" width="220" height="20" rx="3" fill="#1a2b1a" stroke="#5a8f5a" stroke-width="1"/>
  <text x="615" y="396" text-anchor="middle" font-size="8" fill="#8fbf8f">shuffle(questions).slice(0, cantidad)</text>

  <line x1="565" y1="415" x2="715" y2="415" stroke="#bf8fbf" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="640" y="410" text-anchor="middle" font-size="9" fill="#bf8fbf">attempt.create({ data: { ...AttemptQuestions } })</text>

  <line x1="715" y1="437" x2="570" y2="437" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="642" y="433" text-anchor="middle" font-size="8" fill="#666">Attempt { id, questions[0] }</text>

  <line x1="560" y1="460" x2="267" y2="460" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="413" y="456" text-anchor="middle" font-size="8" fill="#666">{ attemptId, primeraP regunta, totalPreguntas }</text>

  <line x1="257" y1="485" x2="90" y2="485" stroke="#7fa8d8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#a1)"/>
  <text x="173" y="481" text-anchor="middle" font-size="9" fill="#7fa8d8">201 Created — primera pregunta</text>

  <!-- Activation boxes -->
  <rect x="253" y="95" width="18" height="400" rx="2" fill="#5a8f5a" opacity="0.25"/>
  <rect x="556" y="190" width="18" height="280" rx="2" fill="#5a8f5a" opacity="0.25"/>
  <rect x="406" y="120" width="18" height="45" rx="2" fill="#8f8f5a" opacity="0.25"/>
  <rect x="711" y="215" width="18" height="230" rx="2" fill="#8f5a8f" opacity="0.25"/>
</svg>
